{% extends "base.html" %}
{% block content %}

<h2>Chat AI Educațional (Demo)</h2>

<div id="param-container">
    <button id="reportButton" onclick="generateReport()">📄 Generează Raport (test)</button>
</div>

<hr>

<div id="chat-container">
    <div id="chat-history">
        <div class="message bot">
            <div class="content">
                Bună! Sunt asistentul tău AI. Apasă „Generează Raport” pentru a începe.
            </div>
        </div>
    </div>
    <div id="input-area">
        <textarea id="userInput" placeholder="Scrie mesajul tău..." rows="1" disabled></textarea>
        <button id="sendButton" onclick="sendMessage()" disabled>➤</button>
    </div>
</div>

<script>
    const textarea = document.getElementById('userInput');
    textarea.addEventListener('input', () => {
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight) + 'px';
    });

    async function generateReport() {
        try {
            const response = await fetch("{{ url_for('main.generate_report') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({})
            });

            const data = await response.json();
            if (data.status === "ok") {
                alert("Raport generat și salvat în reports.txt!");
                document.getElementById("userInput").disabled = false;
                document.getElementById("sendButton").disabled = false;
            }
        } catch (err) {
            alert("Eroare la generarea raportului: " + err.message);
        }
    }

    async function sendMessage() {
        const userInput = textarea.value.trim();
        if (userInput === "") return;

        const chatHistory = document.getElementById('chat-history');
        const userMessageDiv = document.createElement('div');
        userMessageDiv.className = 'message user';
        userMessageDiv.innerHTML = `<div class="content">${userInput}</div>`;
        chatHistory.appendChild(userMessageDiv);

        textarea.value = '';
        textarea.style.height = 'auto';

        const typingDiv = document.createElement('div');
        typingDiv.className = 'message bot';
        typingDiv.innerHTML = `<div class="content" id="typing-indicator">...</div>`;
        chatHistory.appendChild(typingDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;

        try {
            const response = await fetch("{{ url_for('main.query_model') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: userInput })
            });

            const data = await response.json();
            document.getElementById('typing-indicator').textContent = data.response;

        } catch (error) {
            document.getElementById('typing-indicator').textContent = "Eroare la comunicarea cu AI-ul.";
        }

        chatHistory.scrollTop = chatHistory.scrollHeight;
    }
</script>

{% endblock %}
