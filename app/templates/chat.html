{% extends "base.html" %}
{% block content %}

<h2>Chat AI Educațional (Demo)</h2>

<div id="param-container">
    <button id="reportButton" onclick="generateReport()">📄 Generează Raport General (test)</button>
</div>

<hr>

<div id="chat-container">
    <div id="chat-history">
        <div class="message bot">
            <div class="content" id="initial-message">
                Bună! Sunt asistentul tău AI. Apasă „Generează Raport” pentru a începe.
            </div>
        </div>
    </div>
    <div id="input-area">
        <textarea id="userInput" placeholder="Scrie mesajul tău..." rows="1" disabled></textarea>
        <button id="sendButton" onclick="sendMessage()" disabled>➤</button>
    </div>
</div>

<script>
    // Salvăm referințe la elemente
    const textarea = document.getElementById('userInput');
    const userInputEl = document.getElementById("userInput");
    const sendButtonEl = document.getElementById("sendButton");
    const reportButtonEl = document.getElementById("reportButton");
    const initialMessageEl = document.getElementById("initial-message");

    // Variabilă globală pentru a stoca ID-ul feedback-ului
    let CONTEXT_FEEDBACK_ID = null;

    // Rulăm la încărcarea paginii
    window.addEventListener('DOMContentLoaded', () => {
        // 1. Extragem parametrii din URL
        const urlParams = new URLSearchParams(window.location.search);
        const feedbackId = urlParams.get('feedback_id');

        // 2. Verificăm dacă am primit un feedback_id
        if (feedbackId) {
            CONTEXT_FEEDBACK_ID = feedbackId;

            // 3. Activăm chatul și ascundem butonul de raport general
            reportButtonEl.style.display = 'none'; // Ascundem butonul
            userInputEl.disabled = false;
            sendButtonEl.disabled = false;

            // 4. Schimbăm mesajul de întâmpinare
            if (initialMessageEl) {
                initialMessageEl.textContent = "Bună! Sunt gata să discutăm despre feedback-ul tău specific. Scrie prima întrebare.";
            }
        }
    });

    // Funcție pentru auto-dimensionarea text-area
    textarea.addEventListener('input', () => {
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight) + 'px';
    });

    // Funcția pentru raportul general (rămâne neschimbată)
    async function generateReport() {
        try {
            const response = await fetch("{{ url_for('main.generate_report') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({})
            });

            const data = await response.json();
            if (data.status === "ok") {
                alert("Raport generat și salvat în reports.txt!");
                userInputEl.disabled = false;
                sendButtonEl.disabled = false;
            }
        } catch (err) {
            alert("Eroare la generarea raportului: " + err.message);
        }
    }

    // Funcția de trimitere mesaj (modificată)
    async function sendMessage() {
        const userInput = textarea.value.trim();
        if (userInput === "") return;

        const chatHistory = document.getElementById('chat-history');
        const userMessageDiv = document.createElement('div');
        userMessageDiv.className = 'message user';
        userMessageDiv.innerHTML = `<div class="content">${userInput}</div>`;
        chatHistory.appendChild(userMessageDiv);

        textarea.value = '';
        textarea.style.height = 'auto';

        const typingDiv = document.createElement('div');
        typingDiv.className = 'message bot';
        typingDiv.innerHTML = `<div class="content" id="typing-indicator">...</div>`;
        chatHistory.appendChild(typingDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;

        try {
            // 5. Creăm payload-ul care include feedback_id (dacă există)
            const payload = {
                message: userInput,
                feedback_id: CONTEXT_FEEDBACK_ID // Va fi null sau ID-ul extras din URL
            };

            const response = await fetch("{{ url_for('main.query_model') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload) // Trimitem payload-ul complet
            });

            const data = await response.json();
            const typingBubble = document.getElementById("typing-indicator");

            typingBubble.removeAttribute("id");
            typingBubble.textContent = data.response;

        } catch (error) {
            const typingBubble = document.getElementById("typing-indicator");
            typingBubble.removeAttribute("id");
            typingBubble.textContent = "Eroare la comunicarea cu AI-ul.";
        }

        chatHistory.scrollTop = chatHistory.scrollHeight;
    }
</script>

{% endblock %}
