{% extends "base.html" %}
{% block content %}

<div class="auth-page">
  <div class="auth-logo">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ClassroomApp">
    <h1>ClassroomApp</h1>
  </div>

  <div class="auth-card">
    <h2>Create Account</h2>
    <p>Sign up to access your Classroom</p>

    <form method="post">
      <label>Full Name</label>
      <input type="text" name="name" placeholder="Enter your full name" required>

      <label>Email</label>
      <input type="email" name="email" placeholder="Enter your email address" required>

      <label>Password</label>
      <input type="password" name="password" placeholder="Create a password" required>

      <label>Role</label>
        <select name="role" required>
          <option value="">Select your role</option>
          <option value="Elev">Elev</option>
          <option value="Profesor">Profesor</option>
          <option value="Parinte">Parinte</option>
        </select>

      <button type="submit" class="primary-btn">Sign Up</button>
    </form>

    <p class="switch">
      Already have an account?
      <a href="{{ url_for('main.login') }}">Log in</a>
    </p>
  </div>

  <footer>© 2025 ClassroomApp. All rights reserved.</footer>
</div>

{% endblock %}
